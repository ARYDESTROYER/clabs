# LAB B1 Activity 1 - mod_security custom rules.
# Identical ruleset to Activity 2 (same JuicyMart stack). Activity 1 only
# uses the rule's existence (to fingerprint the WAF), but having the
# transformations here keeps behaviour consistent across both activities.

SecRule REQUEST_URI "@beginsWith /admin" \
    "id:100001,phase:1,deny,status:403,log,auditlog,\
    t:urlDecodeUni,t:lowercase,\
    msg:'Admin path blocked by WAF',\
    tag:'lab/admin-block'"

# Cosmetic rule so XSS-looking input also gets blocked - lets students see
# the WAF react during initial recon.
SecRule ARGS|REQUEST_URI "@rx (?i)(<script|onerror=|javascript:)" \
    "id:100002,phase:2,deny,status:406,log,auditlog,\
    msg:'XSS-like input blocked by WAF',\
    tag:'lab/xss-block'"
