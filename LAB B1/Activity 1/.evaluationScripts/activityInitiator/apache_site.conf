# LAB B1 Apache vhost - Apache reverse-proxies to the Flask app on :5000.
#
# The deliberate misconfiguration is the X-Original-URL rewrite:
# if a request carries an X-Original-URL header, mod_rewrite uses that
# value as the path. mod_security inspects REQUEST_URI in phase:1
# *before* this rewrite happens, so a benign request line ("GET /") with
# a malicious header ("X-Original-URL: /admin/dashboard") sails past the
# WAF and is then routed to the admin endpoint internally.

<VirtualHost *:30000>
    ServerName localhost
    DocumentRoot /var/www/html

    # mod_security audit/engine settings live in /etc/modsecurity/modsecurity.conf;
    # custom rules live in /etc/modsecurity/lab_rules.conf (loaded globally).

    RewriteEngine On

    # Misconfiguration: trust the X-Original-URL header for path routing.
    RewriteCond %{HTTP:X-Original-URL} !^$
    RewriteRule ^.*$ http://127.0.0.1:5000%{HTTP:X-Original-URL} [P,L]

    # Normal traffic: proxy everything else to the Flask app.
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
