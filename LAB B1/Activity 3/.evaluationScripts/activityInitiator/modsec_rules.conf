# LAB B1 Activity 3 - mod_security custom rules for BookHaven.
#
# Two protected paths, deliberately configured DIFFERENTLY so the student
# discovers that not all WAF rules are tuned the same way.
#
# Rule 100001 (the /orders block) is a NAIVE rule: it matches the literal
# raw REQUEST_URI with NO transformations. URL-encoded variants like
# `/o%72ders/admin` therefore slip past it. (The X-Original-URL bypass also
# works against this rule, but URL encoding is the cheaper attack and should
# be tried first.)
SecRule REQUEST_URI "@beginsWith /orders" \
    "id:100001,phase:1,deny,status:403,log,auditlog,\
    msg:'Orders admin path blocked by WAF',\
    tag:'lab/orders-block'"

# Rule 100002 (the /manage block) is PROPERLY tuned: it normalizes the
# input with `t:urlDecodeUni,t:lowercase` before matching, so URL encoding
# tricks fail. Only a header-smuggling bypass (X-Original-URL) gets past.
SecRule REQUEST_URI "@beginsWith /manage" \
    "id:100002,phase:1,deny,status:403,log,auditlog,\
    t:urlDecodeUni,t:lowercase,\
    msg:'Manager path blocked by WAF',\
    tag:'lab/manage-block'"

# Cosmetic rule so XSS-looking input also gets blocked (visible WAF reaction
# during recon).
SecRule ARGS|REQUEST_URI "@rx (?i)(<script|onerror=|javascript:)" \
    "id:100003,phase:2,deny,status:406,log,auditlog,\
    msg:'XSS-like input blocked by WAF',\
    tag:'lab/xss-block'"
