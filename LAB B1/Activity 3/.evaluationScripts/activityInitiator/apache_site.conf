# LAB B1 Activity 3 - Apache vhost (BookHaven). Same proxy + X-Original-URL
# misconfiguration as Activity 2 so the same bypass technique applies.

<VirtualHost *:30000>
    ServerName localhost
    DocumentRoot /var/www/html

    RewriteEngine On

    # Misconfiguration: trust the X-Original-URL header for path routing.
    RewriteCond %{HTTP:X-Original-URL} !^$
    RewriteRule ^.*$ http://127.0.0.1:5000%{HTTP:X-Original-URL} [P,L]

    # Normal traffic: proxy everything else to the Flask app.
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
