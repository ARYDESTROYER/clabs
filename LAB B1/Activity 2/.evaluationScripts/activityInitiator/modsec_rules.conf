# LAB B1 Activity 2 - mod_security custom rules.
#
# Rule 100001 blocks anything starting with /admin AFTER URL-decoding and
# case-folding the URI. The transformations (`t:urlDecodeUni,t:lowercase`)
# are what make naive bypass attempts like /%61dmin or /ADMIN fail. Without
# them, the rule would only match the literal raw string "/admin", which
# would defeat the whole pedagogical point of Activity 2.

SecRule REQUEST_URI "@beginsWith /admin" \
    "id:100001,phase:1,deny,status:403,log,auditlog,\
    t:urlDecodeUni,t:lowercase,\
    msg:'Admin path blocked by WAF',\
    tag:'lab/admin-block'"

# Cosmetic rule so XSS-looking input also gets blocked - lets students see
# the WAF react during initial recon.
SecRule ARGS|REQUEST_URI "@rx (?i)(<script|onerror=|javascript:)" \
    "id:100002,phase:2,deny,status:406,log,auditlog,\
    msg:'XSS-like input blocked by WAF',\
    tag:'lab/xss-block'"
